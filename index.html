<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Periodontitis screening — prototype</title>
<meta name="description" content="A two-minute questionnaire that estimates the risk of severe periodontitis, for use by healthcare professionals. Runs in the browser; nothing is stored.">
<meta name="author" content="Elena Stamatelou">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="social-card.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Periodontitis screening">
<meta property="og:description" content="A two-minute questionnaire that estimates the risk of severe periodontitis, for healthcare professionals.">
<meta property="og:image" content="https://elenastamatelou.github.io/perio-screening-questionnaire-based-tool/social-card.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --hair: #d2d2d7;
    --blue: #0071e3; --blue-soft: #e8f1fc; --orange: #e8590c; --orange-soft: #fdf0e8;
    --seg: #e9e9ee; --radius: 18px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.47;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 680px; margin: 0 auto; padding: 1rem 1.25rem 7rem; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin: .5rem 0 1.25rem; }
  .brand { display: flex; align-items: center; gap: .6rem; font-weight: 600; font-size: .95rem; }
  .brand img { width: 30px; height: 30px; }
  .segmented { display: inline-flex; background: var(--seg); border-radius: 10px; padding: 2px; gap: 2px; }
  .segmented button, .seg-opt span {
    border: 0; background: transparent; font: inherit; color: var(--text); border-radius: 8px; cursor: pointer; }
  .segmented button { padding: .3rem .8rem; font-size: .82rem; font-weight: 500; }
  .segmented button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size: 2.1rem; line-height: 1.12; letter-spacing: -.02em; font-weight: 700; margin: 0 0 .5rem; }
  .subtitle { color: var(--muted); font-size: 1.02rem; margin: 0 0 1.5rem; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.4rem 1.4rem .4rem;
    margin-bottom: 1.25rem; border: 0; }
  .card-title { float: left; width: 100%; font-size: .78rem; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; padding: 0; }
  .card-title + * { clear: both; }
  .question { padding: 0 0 1.15rem; margin-bottom: 1.15rem; border-bottom: 1px solid #f0f0f2; scroll-margin: 90px;
    border-radius: 10px; transition: background .3s; }
  .question:last-child { border-bottom: 0; margin-bottom: 0; }
  .q-label { display: block; font-size: .78rem; font-weight: 600; color: var(--blue); margin-bottom: .2rem; }
  .q-text { display: block; font-size: 1.05rem; font-weight: 500; margin-bottom: .7rem; }
  .question.read-aloud .q-text::before { content: "\201C"; color: var(--muted); }
  .question.read-aloud .q-text::after { content: "\201D"; color: var(--muted); }
  .options { display: flex; background: var(--seg); border-radius: 11px; padding: 2px; gap: 2px; }
  .seg-opt { position: relative; flex: 1; }
  .seg-opt input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
  .seg-opt span { display: block; text-align: center; padding: .6rem .3rem; min-height: 44px; font-size: .93rem;
    line-height: 1.5; }
  .seg-opt input:checked + span { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.14); font-weight: 600;
    color: var(--blue); }
  .seg-opt input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 1px; }
  .q2 .seg-opt span { font-size: .85rem; }
  .age-wrap { display: inline-flex; align-items: center; background: var(--seg); border-radius: 11px; padding: 0 .9rem 0 0; }
  .age-wrap input { width: 6rem; border: 0; background: transparent; font: inherit; font-size: 1.1rem; padding: .65rem .9rem;
    color: var(--text); outline: none; }
  .age-wrap span { color: var(--muted); }
  .field-msg { color: var(--orange); font-size: .85rem; margin: .4rem 0 0; }
  .question.missing { background: var(--orange-soft); box-shadow: 0 0 0 8px var(--orange-soft); }
  .question.missing .q-label { color: var(--orange); }
  .hidden { display: none !important; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: .75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom));
    background: rgba(245,245,247,.82); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid rgba(0,0,0,.06); }
  .dock-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; }
  .progress { flex: 1; font-size: .85rem; color: var(--muted); }
  .bar { height: 4px; background: var(--seg); border-radius: 4px; margin-top: .35rem; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 4px; transition: width .25s; }
  .btn { border: 0; border-radius: 980px; background: var(--blue); color: #fff; font: inherit; font-weight: 600;
    font-size: 1rem; padding: .8rem 1.6rem; cursor: pointer; }
  .btn.secondary { background: var(--seg); color: var(--blue); width: 100%; margin: 1rem 0 1.4rem; }
  .result-label { font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 .4rem; }
  .result-number { font-size: 2.6rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 1rem; display: flex;
    align-items: center; gap: .6rem; }
  .result-number::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: currentColor; }
  .result-number.is-high { color: var(--orange); }
  .result-number.is-low { color: var(--blue); }
  .advice { border-radius: 14px; padding: .9rem 1.1rem; background: var(--blue-soft); font-size: .97rem; }
  .advice.high { background: var(--orange-soft); }
  .advice p { margin: .3rem 0; }
  .why { margin-top: 1.5rem; }
  .why h2 { font-size: 1.15rem; margin: 0 0 .25rem; }
  .why-intro { font-size: .9rem; color: var(--muted); margin: 0 0 .7rem; }
  .why-row { display: grid; grid-template-columns: minmax(0, 1fr) 130px 8rem; align-items: center; gap: .7rem;
    padding: .55rem 0; border-top: 1px solid #f0f0f2; font-size: .93rem; }
  .why-row:first-of-type { border-top: 0; }
  .why-bar { position: relative; height: 10px; background: #f2f2f5; border-radius: 6px; }
  .why-bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--hair); }
  .why-bar span { position: absolute; top: 0; height: 100%; border-radius: 6px; }
  .why-bar span.up { left: 50%; background: var(--orange); }
  .why-bar span.down { right: 50%; background: var(--blue); }
  .why-effect { font-size: .85rem; }
  .why-effect.up { color: var(--orange); } .why-effect.down { color: var(--blue); } .why-effect.none { color: var(--muted); }
  details { border-top: 1px solid #f0f0f2; padding: .85rem 0; margin: 0; }
  details summary { cursor: pointer; font-weight: 600; color: var(--blue); list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: " ›"; }
  details[open] summary::after { content: " ⌄"; }
  details p, details ul { font-size: .9rem; color: var(--muted); }
  .why details { border-top: 0; padding-top: .4rem; }
  .always-caveat { font-size: .9rem; color: var(--muted); margin: 1.2rem 0 .4rem; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 2rem; }
  footer a { color: var(--blue); text-decoration: none; }
  @media (max-width: 520px) {
    h1 { font-size: 1.7rem; }
    .q2 .options { flex-wrap: wrap; }
    .q2 .seg-opt { flex: 1 1 30%; }
    .why-row { grid-template-columns: minmax(0, 1fr) 60px 6.4rem; gap: .45rem; font-size: .86rem; }
  }
</style>
<script data-goatcounter="https://perio-screening.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <div class="topbar">
    <div class="brand"><img src="logo.svg" alt=""><span data-i18n="h1"></span></div>
    <div class="segmented" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="nl">NL</button>
    </div>
  </div>

  <p class="subtitle" data-i18n="subtitle"></p>

  <form id="quiz" novalidate>
    <fieldset class="card">
      <legend class="card-title" data-i18n="legendAboutYou"></legend>
      <div class="question" data-name="age">
        <label class="q-text" for="age" data-i18n="ageLabel"></label>
        <div class="age-wrap"><input type="number" id="age" name="age" min="18" max="100" step="1" inputmode="numeric"
          required><span data-i18n="years"></span></div>
        <p class="field-msg hidden" id="age-msg" data-i18n="ageInvalid"></p>
      </div>
      <div class="question" data-name="sex">
        <span class="q-text" data-i18n="sexLabel"></span>
        <div class="options" role="radiogroup"><label class="seg-opt"><input type="radio" name="sex" value="female" required><span data-i18n="female"></span></label><label class="seg-opt"><input type="radio" name="sex" value="male"><span data-i18n="male"></span></label></div>
      </div>
      <div class="question read-aloud" data-name="smoking">
        <span class="q-label" data-i18n="labSmoking"></span>
        <span class="q-text" data-i18n="smokingQ"></span>
        <div class="options" role="radiogroup"><label class="seg-opt"><input type="radio" name="smoking" value="no" required><span data-i18n="no"></span></label><label class="seg-opt"><input type="radio" name="smoking" value="yes"><span data-i18n="yes"></span></label></div>
      </div>
    </fieldset>

    <fieldset class="card">
      <legend class="card-title" data-i18n="legendTeethGums"></legend>
      <div class="question read-aloud" data-name="q1">
        <span class="q-label" data-i18n="labQ1"></span>
        <span class="q-text" data-i18n="q1"></span>
        <div class="options" role="radiogroup"><label class="seg-opt"><input type="radio" name="q1" value="no" required><span data-i18n="no"></span></label><label class="seg-opt"><input type="radio" name="q1" value="yes"><span data-i18n="yes"></span></label></div>
      </div>
      <div class="question read-aloud" data-name="q3">
        <span class="q-label" data-i18n="labQ3"></span>
        <span class="q-text" data-i18n="q3"></span>
        <div class="options" role="radiogroup"><label class="seg-opt"><input type="radio" name="q3" value="no" required><span data-i18n="no"></span></label><label class="seg-opt"><input type="radio" name="q3" value="yes"><span data-i18n="yes"></span></label></div>
      </div>
      <div class="question read-aloud" data-name="q4">
        <span class="q-label" data-i18n="labQ4"></span>
        <span class="q-text" data-i18n="q4"></span>
        <div class="options" role="radiogroup"><label class="seg-opt"><input type="radio" name="q4" value="no" required><span data-i18n="no"></span></label><label class="seg-opt"><input type="radio" name="q4" value="yes"><span data-i18n="yes"></span></label></div>
      </div>
      <div class="question read-aloud" data-name="q5">
        <span class="q-label" data-i18n="labQ5"></span>
        <span class="q-text" data-i18n="q5"></span>
        <div class="options" role="radiogroup"><label class="seg-opt"><input type="radio" name="q5" value="no" required><span data-i18n="no"></span></label><label class="seg-opt"><input type="radio" name="q5" value="yes"><span data-i18n="yes"></span></label></div>
      </div>
      <div class="question read-aloud" data-name="q6">
        <span class="q-label" data-i18n="labQ6"></span>
        <span class="q-text" data-i18n="q6"></span>
        <div class="options" role="radiogroup"><label class="seg-opt"><input type="radio" name="q6" value="no" required><span data-i18n="no"></span></label><label class="seg-opt"><input type="radio" name="q6" value="yes"><span data-i18n="yes"></span></label></div>
      </div>
      <div class="question read-aloud q2" data-name="q2">
        <span class="q-label" data-i18n="labQ2"></span>
        <span class="q-text" data-i18n="q2"></span>
        <div class="options" role="radiogroup"><label class="seg-opt"><input type="radio" name="q2" value="1" required><span data-i18n="q2Excellent"></span></label><label class="seg-opt"><input type="radio" name="q2" value="2"><span data-i18n="q2VeryGood"></span></label><label class="seg-opt"><input type="radio" name="q2" value="3"><span data-i18n="q2Good"></span></label><label class="seg-opt"><input type="radio" name="q2" value="4"><span data-i18n="q2Fair"></span></label><label class="seg-opt"><input type="radio" name="q2" value="5"><span data-i18n="q2Poor"></span></label></div>
      </div>
    </fieldset>
  </form>

  <section id="result-screen" class="card hidden" style="padding-bottom:.2rem">
    <p class="result-label" data-i18n="resultLabel"></p>
    <p class="result-number" id="result-number">—</p>
    <div class="advice" id="advice"></div>
    <div class="why hidden" id="why">
      <h2 data-i18n="whyTitle"></h2>
      <p class="why-intro" data-i18n="whyIntro"></p>
      <div id="why-rows"></div>
      <details>
        <summary data-i18n="whyHowSummary"></summary>
        <p data-i18n="whyHow"></p>
      </details>
    </div>
    <details id="prob-details">
      <summary data-i18n="probSummary"></summary>
      <p><b id="result-pct">—</b>: <span id="result-words"></span>. <span id="thr-note"></span></p>
    </details>
    <p class="always-caveat" data-i18n="alwaysCaveat"></p>
    <details>
      <summary data-i18n="aboutSummary"></summary>
      <p data-i18n="aboutP1"></p>
      <p data-i18n="aboutLi5"></p>
    </details>
    <button type="button" id="restart-btn" class="btn secondary" data-i18n="restartBtn"></button>
  </section>

  <footer>
    <span data-i18n="privacy"></span><br><span data-i18n="footerText"></span> · <a href="https://github.com/ElenaStamatelou/perio-screening-questionnaire-based-tool" data-i18n="footerSource"></a>
  </footer>
</main>

<div class="dock" id="dock">
  <div class="dock-inner">
    <div class="progress"><span id="progress-text"></span><div class="bar"><i id="progress-bar"></i></div></div>
    <button type="submit" form="quiz" id="submit-btn" class="btn" data-i18n="submitBtn"></button>
  </div>
</div>

<script src="model.js"></script>

      probSummary: 'Toon de voorspelde kans',
      thrNote: (t) => `Hoog risico betekent een voorspelde kans van ${t}% of meer.`,
      alwaysCaveat: 'Deze screeningsuitslag is geen diagnose. Parodontitis wordt vastgesteld door een tandheelkundig onderzoek. Heeft de patiënt een van de klachten hierboven, adviseer dan sowieso een bezoek aan de tandarts, ongeacht deze uitslag.',
      aboutSummary: 'Over deze tool',
      aboutP1: 'Deze uitslag komt van een op machine learning gebaseerd model, ontwikkeld in een onderzoeksproject dat vragenlijsten over zelfgerapporteerde mondgezondheid valideert als hulpmiddel bij het screenen op parodontitis. Het model is ontwikkeld met 341 personen uit twee Nederlandse cohorten van medische poliklinieken (Amsterdam UMC, afdeling Interne Geneeskunde); ernstige parodontitis werd gedefinieerd als een score van 4 op de Community Periodontal Index of Treatment Needs (CPITN) in ten minste één sextant. Het model en de validatie ervan worden beschreven in Stamatelou et al. (2027).',
      aboutLi1: 'De zes vragen hierboven zijn de gepubliceerde Nederlandse ' +
        'vertaling uit het oorspronkelijke onderzoek (Verhulst et al., 2019, ' +
        'aanvullend materiaal) — dichter bij de vraagtekst waarop het model ' +
        'is gevalideerd dan de Engelse bewerking op deze pagina, maar dit ' +
        'webformulier zelf is niet opnieuw en apart gevalideerd.',
      aboutLi2: 'Het model is ontwikkeld bij poliklinische patiënten van de Interne ' +
        'Geneeskunde, niet in de algemene bevolking. In een parodontologiekliniek, ' +
        'waar ernstige parodontitis vaker voorkomt, rangschikte het patiënten even ' +
        'goed, maar waren de voorspelde kansen te laag.',
      aboutLi3: 'Niets van wat u in het formulier invult — uw leeftijd, ' +
        'antwoorden of uitslag — wordt verzonden, gelogd of ergens ' +
        'opgeslagen. De berekening gebeurt volledig in uw browser.',
      aboutLi4: 'Deze pagina gebruikt GoatCounter, een privacyvriendelijke ' +
        'analysedienst, om anonieme paginabezoeken te tellen (geen cookies, ' +
        'geen persoonsgegevens, geen antwoorden uit het formulier). Dit wordt ' +
        'alleen gebruikt om te zien hoe vaak de tool wordt gebruikt, nooit wat ' +
        'iemand heeft geantwoord.',
      aboutLi5: 'Dit is een onderzoeksprototype, geen gecertificeerd medisch ' +
        'hulpmiddel of klinisch beslissingsinstrument.',
      restartBtn: 'Opnieuw beginnen',
      inTen: (k) => `ongeveer ${k} op de 10 mensen met deze antwoorden hebben ernstige parodontitis`,
      oneIn: (k) => `ongeveer 1 op de ${k} mensen met deze antwoorden heeft ernstige parodontitis`,
      highTitle: 'Advies',
      highAsk: 'Vraag de patiënt: heeft u een tandarts, en wordt uw tandvlees ' +
        'gecontroleerd of behandeld voor een tandvleesaandoening?',
      highYes: 'Ja: adviseer de patiënt die zorg voort te zetten.',
      highNo: 'Nee: adviseer een bezoek aan een tandarts of parodontoloog voor een tandvleesonderzoek.',
      lowTitle: 'Advies',
      lowAdvice: 'Nu geen specifiek advies: gewone tandheelkundige controles, en ' +
        'naar de tandarts bij tandvleesklachten.',
      footerText: 'Onderzoeksprototype van Elena Stamatelou',
      footerSource: 'broncode',
      whyTitle: 'Waarom deze uitslag?',
      whyIntro: 'De antwoorden hieronder verhoogden (▲) of verlaagden (▼) de uitslag:',
      whyItem: (name, yes) => `${name}: ${yes ? 'ja' : 'nee'}`,
      itemNames: { Q1_gum_disease: 'Zelfgerapporteerde tandvleesaandoening', Q3_gum_treatment: 'Zelfgerapporteerde tandvleesbehandeling',
        Q4_loose_teeth: 'Ervaren losstaande tanden', Q5_bone_loss: 'Ervaren botverlies rondom de tanden',
        Q6_tooth_appearance: 'Zorgen over het uiterlijk van een tand' },
      whyAge: (a) => `Leeftijd ${a}`,
      whySmokes: 'Rookt',
      whyNoSmoke: 'Rookt niet',
      whyQ2: (r) => `Beoordeelt tanden en tandvlees als ${r}`,
      effect: { up3: '▲ verhoogt sterk', up2: '▲ verhoogt', up1: '▲ verhoogt licht',
        none: 'nauwelijks effect', down1: '▼ verlaagt licht', down2: '▼ verlaagt',
        down3: '▼ verlaagt sterk' },
      whyHowSummary: 'Zo leest u dit',
      whyHow: 'Elke balk laat zien hoeveel een antwoord de uitslag verschoof. De balken verklaren de uitslag, niet de oorzaak van ernstige parodontitis; een patiënt zonder klachten kan toch parodontitis hebben. Details: Stamatelou et al. (2027). Dit is een onderzoeksprototype, geen gecertificeerd medisch hulpmiddel of klinisch beslissingsinstrument.',
    },
  };

  function applyLanguage(lang) {
    document.documentElement.lang = lang;
    document.title = I18N[lang].docTitle;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.getAttribute('data-i18n');
      if (I18N[lang][key] != null) el.textContent = I18N[lang][key];
    });
    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false');
    });
    currentLang = lang;
    if (lastRisk != null) showAdvice(lastRisk);
    if (lastAnswers != null) showWhy(lastAnswers);
  }

  let currentLang = 'en';
  let lastRisk = null;
  let lastAnswers = null;

  // "Why this result": the SHAP value of each model input (explainSevereRisk in model.js), largest
  // first. Bars are scaled to this patient's largest value, but never to less than 1 (log-odds), so
  // small effects stay small; the words come from the size on the log-odds scale.
  function effectKey(v) {
    const a = Math.abs(v);
    const level = a >= 0.75 ? 3 : a >= 0.3 ? 2 : a >= 0.1 ? 1 : 0;
    return level === 0 ? 'none' : (v > 0 ? 'up' : 'down') + level;
  }

  function showWhy(answers) {
    const box = document.getElementById('why');
    if (typeof explainSevereRisk !== 'function' || !MODEL.trainingMeans) {
      box.classList.add('hidden');                     // model.js exported without the reference
      return;
    }
    const t = I18N[currentLang];
    const { values, inputs } = explainSevereRisk(answers);
    const scale = Math.max(1, ...Object.values(values).map(Math.abs));
    const q2Words = [null, t.q2Excellent, t.q2VeryGood, t.q2Good, t.q2Fair, t.q2Poor];
    // One row per symptom question (Elena, 13 Nov 2026), with the patient's answer
    const label = {
      ...Object.fromEntries(SYMPTOM_KEYS.map((k) => [k, t.whyItem(t.itemNames[k], answers[k])])),
      Age: t.whyAge(answers.Age),
      Smoking: answers.Smoking ? t.whySmokes : t.whyNoSmoke,
      Q2_own_teeth_gum_health: t.whyQ2(q2Words[answers.Q2_own_teeth_gum_health].toLowerCase()),
      Sex: answers.Sex === 'male' ? t.male : t.female,
    };
    const rows = document.getElementById('why-rows');
    rows.replaceChildren();
    Object.keys(values).sort((a, b) => Math.abs(values[b]) - Math.abs(values[a])).forEach((key) => {
      const v = values[key];
      const kind = effectKey(v);
      const dir = kind === 'none' ? 'none' : kind.slice(0, -1);
      const row = document.createElement('div');
      row.className = 'why-row';
      const name = document.createElement('span');
      name.textContent = label[key];
      const bar = document.createElement('span');
      bar.className = 'why-bar';
      bar.setAttribute('aria-hidden', 'true');
      if (dir !== 'none') {
        const fill = document.createElement('span');
        fill.className = dir;
        fill.style.width = `${Math.min(50, (Math.abs(v) / scale) * 50)}%`;
        bar.append(fill);
      }
      const effect = document.createElement('span');
      effect.className = 'why-effect ' + dir;
      effect.textContent = t.effect[kind];
      row.append(name, bar, effect);
      rows.append(row);
    });
    box.classList.remove('hidden');
  }

  // The result in words and the advice (high: ask about dental care first; low: routine care), at the
  // operating threshold of the model.
  function showAdvice(risk) {
    const t = I18N[currentLang];
    const isHigh = risk >= MODEL.operatingThreshold;
    resultNumber.textContent = isHigh ? t.high : t.low;
    resultNumber.className = 'result-number ' + (isHigh ? 'is-high' : 'is-low');
    document.getElementById('result-pct').textContent = `${Math.round(risk * 100)}%`;
    document.getElementById('thr-note').textContent = t.thrNote(Math.round(MODEL.operatingThreshold * 100));
    document.getElementById('result-words').textContent =
      risk >= 0.5 ? t.inTen(Math.round(risk * 10)) : t.oneIn(Math.max(1, Math.round(1 / risk)));
    const box = document.getElementById('advice');
    box.replaceChildren();
    const lines = risk >= MODEL.operatingThreshold
      ? [[t.highTitle, true], [t.highAsk], [t.highYes], [t.highNo]]
      : [[t.lowTitle, true], [t.lowAdvice]];
    box.className = 'advice' + (risk >= MODEL.operatingThreshold ? ' high' : '');
    for (const [text, bold] of lines) {
      const p = document.createElement('p');
      if (bold) { const b = document.createElement('b'); b.textContent = text; p.append(b); }
      else p.textContent = text;
      box.append(p);
    }
  }

  document.querySelectorAll('.lang-btn').forEach((btn) => {
    btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
  });
  applyLanguage('en');

  const form = document.getElementById('quiz');
  const submitBtn = document.getElementById('submit-btn');
  const resultScreen = document.getElementById('result-screen');
  const resultNumber = document.getElementById('result-number');
  const subtitle = document.querySelector('.subtitle');

  // Age must be a whole number of years in the range the input allows (18-100); anything else keeps the
  // button disabled and shows a message under the field.
  const ageInput = document.getElementById('age');
  const ageMsg = document.getElementById('age-msg');
  function ageValid() {
    const raw = ageInput.value.trim();
    if (!/^\d+$/.test(raw)) return false;
    const a = Number(raw);
    return a >= Number(ageInput.min) && a <= Number(ageInput.max);
  }

  function allAnswered() {
    const required = form.querySelectorAll('[required]');
    for (const field of required) {
      if (field.type === 'radio') {
        if (!form.querySelector(`input[name="${field.name}"]:checked`)) return false;
      } else if (!field.value) {
        return false;
      }
    }
    return ageValid();
  }

  // Mockup: progress in the bottom bar; the button stays active and, with gaps, jumps to the first one
  const NAMES = ['age', 'sex', 'smoking', 'q1', 'q3', 'q4', 'q5', 'q6', 'q2'];
  function answered(name) {
    return name === 'age' ? ageValid() : !!form.querySelector(`input[name="${name}"]:checked`);
  }
  function updateProgress() {
    const k = NAMES.filter(answered).length;
    const t = I18N[currentLang];
    document.getElementById('progress-text').textContent = k === NAMES.length ? t.complete : t.progress(k, NAMES.length);
    document.getElementById('progress-bar').style.width = `${(100 * k) / NAMES.length}%`;
    NAMES.forEach((n) => { if (answered(n)) form.querySelector(`[data-name="${n}"]`).classList.remove('missing'); });
  }
  form.addEventListener('input', () => {
    // badInput: the browser holds text that is not a number (the value then reads as empty)
    const typed = ageInput.value !== '' || ageInput.validity.badInput;
    ageMsg.classList.toggle('hidden', !typed || ageValid());
    updateProgress();
  });
  document.querySelectorAll('.lang-btn').forEach((btn) => btn.addEventListener('click', updateProgress));
  updateProgress();

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!allAnswered()) {                  // never score an incomplete form: show the gaps instead
      const gaps = NAMES.filter((n) => !answered(n));
      gaps.forEach((n) => form.querySelector(`[data-name="${n}"]`).classList.add('missing'));
      form.querySelector(`[data-name="${gaps[0]}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    const data = new FormData(form);

    const answers = {
      Age: Number(data.get('age')),
      Sex: data.get('sex'),
      Smoking: data.get('smoking') === 'yes',
      Q1_gum_disease: data.get('q1') === 'yes',
      Q3_gum_treatment: data.get('q3') === 'yes',
      Q4_loose_teeth: data.get('q4') === 'yes',
      Q5_bone_loss: data.get('q5') === 'yes',
      Q6_tooth_appearance: data.get('q6') === 'yes',
      Q2_own_teeth_gum_health: Number(data.get('q2')),
    };

    const risk = predictSevereRisk(answers);
    lastRisk = risk;
    lastAnswers = answers;
    showAdvice(risk);
    showWhy(answers);

    form.classList.add('hidden');
    document.getElementById('dock').classList.add('hidden');
    subtitle.classList.add('hidden');      // the instruction is for the questions, not for the result
    resultScreen.classList.remove('hidden');
    resultScreen.scrollIntoView({ behavior: 'smooth' });
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    form.reset();
    lastRisk = null;
    lastAnswers = null;
    document.getElementById('why').classList.add('hidden');
    document.getElementById('prob-details').open = false;
    resultScreen.classList.add('hidden');
    document.getElementById('dock').classList.remove('hidden');
    form.querySelectorAll('.missing').forEach((el) => el.classList.remove('missing'));
    updateProgress();
    ageMsg.classList.add('hidden');
    subtitle.classList.remove('hidden');
    form.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

</script>
</body>
</html>
