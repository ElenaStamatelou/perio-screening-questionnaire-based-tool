<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Periodontitis risk screening — prototype</title>
<meta name="description" content="A two-minute questionnaire that estimates the risk of severe periodontitis, for use by healthcare professionals. Runs in the browser; nothing is stored.">
<meta name="author" content="Elena Stamatelou">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="social-card.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Periodontitis risk screening">
<meta property="og:description" content="A two-minute questionnaire that estimates the risk of severe periodontitis, for healthcare professionals.">
<meta property="og:image" content="https://elenastamatelou.github.io/perio-screening-questionnaire-based-tool/social-card.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1c1c1a;
    --muted: #5b5b56;
    --border: #ddddd8;
    --accent: #2f6f5e;
    --accent-contrast: #ffffff;
    --warn-bg: #fdf3e7;
    --warn-border: #e8c99a;
    --warn-text: #6b4a15;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
  }
  .lang-toggle {
    display: flex;
    justify-content: flex-end;
    gap: 0.4rem;
    margin-bottom: 0.5rem;
  }
  .lang-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    border-radius: 999px;
    padding: 0.3rem 0.8rem;
    font-size: 0.8rem;
    font: inherit;
    cursor: pointer;
  }
  .lang-btn[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
    font-weight: 600;
  }
  h1 {
    font-size: 1.4rem;
    margin: 1rem 0 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  h1 img { width: 40px; height: 40px; flex: none; }
  .subtitle {
    color: var(--muted);
    margin: 0 0 1.25rem;
    font-size: 0.95rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 1.25rem;
  }
  legend {
    font-weight: 600;
    padding: 0;
    margin-bottom: 0.5rem;
  }
  .question {
    margin-bottom: 1.1rem;
  }
  .question label.q-text {
    display: block;
    margin-bottom: 0.45rem;
    font-weight: 500;
  }
  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .option {
    position: relative;
  }
  .option input {
    position: absolute;
    opacity: 0;
    inset: 0;
    cursor: pointer;
  }
  .option span {
    display: inline-block;
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.9rem;
    color: var(--text);
    background: var(--bg);
  }
  .option input:checked + span {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }
  .option input:focus-visible + span {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  input[type="number"] {
    width: 100%;
    max-width: 140px;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  button {
    font: inherit;
  }
  #submit-btn {
    width: 100%;
    padding: 0.85rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #submit-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .hidden { display: none; }
  .result-number {
    font-size: 2.6rem;
    font-weight: 700;
    margin: 0.25rem 0 0.1rem;
  }
  .result-label {
    color: var(--muted);
    margin: 0 0 1rem;
    font-size: 0.95rem;
  }
  .result-words {
    color: var(--muted);
    margin: 0 0 1rem;
  }
  .advice {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
  }
  .result-number.is-high { color: var(--warn-text); }
  .result-number.is-low { color: var(--accent); }
  .advice.high { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-text); }
  .advice p { margin: 0.25rem 0; }
  /* "Why this result": one row per model input, a bar from the centre line (right = raises, left =
     lowers the estimate) and the effect in words; SHAP values of the model (explainSevereRisk). */
  .why { margin-top: 1rem; }
  .why h2 { font-size: 1rem; margin: 0 0 0.25rem; }
  .why-intro { font-size: 0.9rem; color: var(--muted); margin: 0 0 0.6rem; }
  .why-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 140px 7.5rem;
    align-items: center;
    gap: 0.6rem;
    padding: 0.35rem 0;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .why-row:first-of-type { border-top: none; }
  .why-bar { position: relative; height: 12px; }
  .why-bar::before {                       /* centre line = the average patient */
    content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px;
    border-left: 1px solid var(--muted);
  }
  .why-bar span { position: absolute; top: 0; height: 100%; border-radius: 2px; }
  .why-bar span.up { left: 50%; background: #c98a3a; }
  .why-bar span.down { right: 50%; background: var(--accent); }
  .why-effect { font-size: 0.85rem; }
  .why-effect.up { color: var(--warn-text); }
  .why-effect.down { color: var(--accent); }
  .why-effect.none { color: var(--muted); }
  .why details { margin-top: 0.6rem; }
  @media (max-width: 480px) {
    .why-row { grid-template-columns: minmax(0, 1fr) 64px 6.2rem; gap: 0.4rem; font-size: 0.85rem; }
    .why-effect { font-size: 0.8rem; }
  }
  .always-caveat {
    border-left: 3px solid var(--accent);
    padding: 0.15rem 0 0.15rem 0.85rem;
    margin: 1rem 0;
    font-size: 0.92rem;
  }
  details {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-top: 1rem;
  }
  details summary {
    cursor: pointer;
    font-weight: 600;
  }
  details p, details ul {
    font-size: 0.9rem;
    color: var(--muted);
  }
  #restart-btn {
    margin-top: 1.25rem;
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2rem;
  }
</style>
<script data-goatcounter="https://perio-screening.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <div class="lang-toggle">
    <button type="button" class="lang-btn" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="nl">NL</button>
  </div>

  <h1><img src="logo.svg" alt=""><span data-i18n="h1"></span></h1>
  <p class="subtitle" data-i18n="subtitle"></p>

  <form id="quiz" class="panel">
    <fieldset>
      <legend data-i18n="legendAboutYou"></legend>

      <div class="question">
        <label class="q-text" for="age" data-i18n="ageLabel"></label>
        <input type="number" id="age" name="age" min="18" max="100" required>
      </div>

      <div class="question">
        <span class="q-text" data-i18n="sexLabel"></span>
        <div class="options">
          <label class="option">
            <input type="radio" name="sex" value="female" required>
            <span data-i18n="female"></span>
          </label>
          <label class="option">
            <input type="radio" name="sex" value="male">
            <span data-i18n="male"></span>
          </label>
        </div>
      </div>

      <div class="question">
        <span class="q-text" data-i18n="smokingQ"></span>
        <div class="options">
          <label class="option">
            <input type="radio" name="smoking" value="no" required>
            <span data-i18n="no"></span>
          </label>
          <label class="option">
            <input type="radio" name="smoking" value="yes">
            <span data-i18n="yes"></span>
          </label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="legendTeethGums"></legend>

      <div class="question">
        <span class="q-text" data-i18n="q1"></span>
        <div class="options">
          <label class="option"><input type="radio" name="q1" value="no" required><span data-i18n="no"></span></label>
          <label class="option"><input type="radio" name="q1" value="yes"><span data-i18n="yes"></span></label>
        </div>
      </div>

      <div class="question">
        <span class="q-text" data-i18n="q3"></span>
        <div class="options">
          <label class="option"><input type="radio" name="q3" value="no" required><span data-i18n="no"></span></label>
          <label class="option"><input type="radio" name="q3" value="yes"><span data-i18n="yes"></span></label>
        </div>
      </div>

      <div class="question">
        <span class="q-text" data-i18n="q4"></span>
        <div class="options">
          <label class="option"><input type="radio" name="q4" value="no" required><span data-i18n="no"></span></label>
          <label class="option"><input type="radio" name="q4" value="yes"><span data-i18n="yes"></span></label>
        </div>
      </div>

      <div class="question">
        <span class="q-text" data-i18n="q5"></span>
        <div class="options">
          <label class="option"><input type="radio" name="q5" value="no" required><span data-i18n="no"></span></label>
          <label class="option"><input type="radio" name="q5" value="yes"><span data-i18n="yes"></span></label>
        </div>
      </div>

      <div class="question">
        <span class="q-text" data-i18n="q6"></span>
        <div class="options">
          <label class="option"><input type="radio" name="q6" value="no" required><span data-i18n="no"></span></label>
          <label class="option"><input type="radio" name="q6" value="yes"><span data-i18n="yes"></span></label>
        </div>
      </div>

      <div class="question">
        <span class="q-text" data-i18n="q2"></span>
        <div class="options">
          <label class="option"><input type="radio" name="q2" value="1" required><span data-i18n="q2Excellent"></span></label>
          <label class="option"><input type="radio" name="q2" value="2"><span data-i18n="q2VeryGood"></span></label>
          <label class="option"><input type="radio" name="q2" value="3"><span data-i18n="q2Good"></span></label>
          <label class="option"><input type="radio" name="q2" value="4"><span data-i18n="q2Fair"></span></label>
          <label class="option"><input type="radio" name="q2" value="5"><span data-i18n="q2Poor"></span></label>
        </div>
      </div>
    </fieldset>

    <button type="submit" id="submit-btn" disabled data-i18n="submitBtn"></button>
  </form>

  <section id="result-screen" class="panel hidden">
    <p class="result-label" data-i18n="resultLabel"></p>
    <p class="result-number" id="result-number">—</p>
    <div class="advice" id="advice"></div>
    <div class="why hidden" id="why">
      <h2 data-i18n="whyTitle"></h2>
      <p class="why-intro" data-i18n="whyIntro"></p>
      <div id="why-rows"></div>
      <details>
        <summary data-i18n="whyHowSummary"></summary>
        <p data-i18n="whyHow"></p>
      </details>
    </div>
    <details id="prob-details">
      <summary data-i18n="probSummary"></summary>
      <p><b id="result-pct">—</b>: <span id="result-words"></span>. <span id="thr-note"></span></p>
    </details>

    <div class="always-caveat" data-i18n="alwaysCaveat"></div>

    <details>
      <summary data-i18n="aboutSummary"></summary>
      <p data-i18n="aboutP1"></p>
      <ul>
        <li data-i18n="aboutLi1"></li>
        <li data-i18n="aboutLi2"></li>
        <li data-i18n="aboutLi3"></li>
        <li data-i18n="aboutLi4"></li>
        <li data-i18n="aboutLi5"></li>
      </ul>
    </details>

    <button type="button" id="restart-btn" data-i18n="restartBtn"></button>
  </section>

  <footer>
    <span data-i18n="footerText"></span> · <a href="https://github.com/ElenaStamatelou/perio-screening-questionnaire-based-tool" data-i18n="footerSource"></a>
  </footer>
</main>

<script src="model.js"></script>

      aboutLi4: 'Deze pagina gebruikt GoatCounter, een privacyvriendelijke ' +
        'analysedienst, om anonieme paginabezoeken te tellen (geen cookies, ' +
        'geen persoonsgegevens, geen antwoorden uit het formulier). Dit wordt ' +
        'alleen gebruikt om te zien hoe vaak de tool wordt gebruikt, nooit wat ' +
        'iemand heeft geantwoord.',
      aboutLi5: 'Dit is een onderzoeksprototype, geen gecertificeerd medisch ' +
        'hulpmiddel of klinisch beslissingsinstrument.',
      restartBtn: 'Opnieuw beginnen',
      inTen: (k) => `ongeveer ${k} op de 10 mensen met deze antwoorden hebben ernstige parodontitis`,
      oneIn: (k) => `ongeveer 1 op de ${k} mensen met deze antwoorden heeft ernstige parodontitis`,
      highTitle: 'Advies',
      highAsk: 'Vraag de patiënt: heeft u een tandarts, en wordt uw tandvlees ' +
        'gecontroleerd of behandeld voor een tandvleesaandoening?',
      highYes: 'Ja: adviseer die zorg voort te zetten en deze uitslag te noemen.',
      highNo: 'Nee: adviseer een bezoek aan een tandarts of parodontoloog voor een tandvleesonderzoek.',
      lowTitle: 'Advies',
      lowAdvice: 'Nu geen specifiek advies: gewone tandheelkundige controles, en ' +
        'naar de tandarts bij tandvleesklachten.',
      footerText: 'Onderzoeksprototype van Elena Stamatelou',
      footerSource: 'broncode',
      whyTitle: 'Waarom deze uitslag?',
      whyIntro: 'Vergeleken met de gemiddelde patiënt uit het onderzoek waarop het model ' +
        'is gebouwd, verhoogden (▲) of verlaagden (▼) deze antwoorden de schatting:',
      whySymptoms: (k, names) => `Tandvleesvragen 1–5: ${k} van de 5 met ja beantwoord` +
        (names.length ? ` (${names.join(', ')})` : ''),
      symptomNames: { Q1_gum_disease: 'tandvleesaandoening', Q3_gum_treatment: 'tandvleesbehandeling',
        Q4_loose_teeth: 'losstaande tanden', Q5_bone_loss: 'botverlies',
        Q6_tooth_appearance: 'tand die er niet goed uitziet' },
      whyAge: (a) => `Leeftijd ${a}`,
      whySmokes: 'Rookt',
      whyNoSmoke: 'Rookt niet',
      whyQ2: (r) => `Beoordeelt tanden en tandvlees als ${r}`,
      effect: { up3: '▲ verhoogt sterk', up2: '▲ verhoogt', up1: '▲ verhoogt licht',
        none: 'nauwelijks effect', down1: '▼ verlaagt licht', down2: '▼ verlaagt',
        down3: '▼ verlaagt sterk' },
      whyHowSummary: 'Zo leest u dit',
      whyHow: 'De balken zijn SHAP-waarden (SHapley Additive exPlanations). Voor dit model ' +
        'laten ze precies zien hoeveel elk antwoord de schatting verschuift ten opzichte ' +
        'van het gemiddelde antwoord van de 341 patiënten waarop het model is ontwikkeld: ' +
        'naar rechts verhoogt het de schatting, naar links verlaagt het die. Ze verklaren ' +
        'de berekening van het model, niet de oorzaak van de ziekte, en een patiënt zonder ' +
        'klachten kan toch parodontitis hebben.',
    },
  };

  function applyLanguage(lang) {
    document.documentElement.lang = lang;
    document.title = I18N[lang].docTitle;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.getAttribute('data-i18n');
      if (I18N[lang][key] != null) el.textContent = I18N[lang][key];
    });
    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false');
    });
    currentLang = lang;
    if (lastRisk != null) showAdvice(lastRisk);
    if (lastAnswers != null) showWhy(lastAnswers);
  }

  let currentLang = 'en';
  let lastRisk = null;
  let lastAnswers = null;

  // "Why this result": the SHAP value of each model input (explainSevereRisk in model.js), largest
  // first. Bars are scaled to this patient's largest value, but never to less than 1 (log-odds), so
  // small effects stay small; the words come from the size on the log-odds scale.
  function effectKey(v) {
    const a = Math.abs(v);
    const level = a >= 0.75 ? 3 : a >= 0.3 ? 2 : a >= 0.1 ? 1 : 0;
    return level === 0 ? 'none' : (v > 0 ? 'up' : 'down') + level;
  }

  function showWhy(answers) {
    const box = document.getElementById('why');
    if (typeof explainSevereRisk !== 'function' || !MODEL.trainingMeans) {
      box.classList.add('hidden');                     // model.js exported without the reference
      return;
    }
    const t = I18N[currentLang];
    const { values, inputs } = explainSevereRisk(answers);
    const scale = Math.max(1, ...Object.values(values).map(Math.abs));
    const q2Words = [null, t.q2Excellent, t.q2VeryGood, t.q2Good, t.q2Fair, t.q2Poor];
    const label = {
      symptom_count: t.whySymptoms(inputs.symptom_count,
        SYMPTOM_KEYS.filter((k) => answers[k]).map((k) => t.symptomNames[k])),
      Age: t.whyAge(answers.Age),
      Smoking: answers.Smoking ? t.whySmokes : t.whyNoSmoke,
      Q2_own_teeth_gum_health: t.whyQ2(q2Words[answers.Q2_own_teeth_gum_health].toLowerCase()),
      Sex: answers.Sex === 'male' ? t.male : t.female,
    };
    const rows = document.getElementById('why-rows');
    rows.replaceChildren();
    Object.keys(values).sort((a, b) => Math.abs(values[b]) - Math.abs(values[a])).forEach((key) => {
      const v = values[key];
      const kind = effectKey(v);
      const dir = kind === 'none' ? 'none' : kind.slice(0, -1);
      const row = document.createElement('div');
      row.className = 'why-row';
      const name = document.createElement('span');
      name.textContent = label[key];
      const bar = document.createElement('span');
      bar.className = 'why-bar';
      bar.setAttribute('aria-hidden', 'true');
      if (dir !== 'none') {
        const fill = document.createElement('span');
        fill.className = dir;
        fill.style.width = `${Math.min(50, (Math.abs(v) / scale) * 50)}%`;
        bar.append(fill);
      }
      const effect = document.createElement('span');
      effect.className = 'why-effect ' + dir;
      effect.textContent = t.effect[kind];
      row.append(name, bar, effect);
      rows.append(row);
    });
    box.classList.remove('hidden');
  }

  // The result in words and the advice (high: ask about dental care first; low: routine care), at the
  // operating threshold of the model.
  function showAdvice(risk) {
    const t = I18N[currentLang];
    const isHigh = risk >= MODEL.operatingThreshold;
    resultNumber.textContent = isHigh ? t.high : t.low;
    resultNumber.className = 'result-number ' + (isHigh ? 'is-high' : 'is-low');
    document.getElementById('result-pct').textContent = `${Math.round(risk * 100)}%`;
    document.getElementById('thr-note').textContent = t.thrNote(Math.round(MODEL.operatingThreshold * 100));
    document.getElementById('result-words').textContent =
      risk >= 0.5 ? t.inTen(Math.round(risk * 10)) : t.oneIn(Math.max(1, Math.round(1 / risk)));
    const box = document.getElementById('advice');
    box.replaceChildren();
    const lines = risk >= MODEL.operatingThreshold
      ? [[t.highTitle, true], [t.highAsk], [t.highYes], [t.highNo]]
      : [[t.lowTitle, true], [t.lowAdvice]];
    box.className = 'advice' + (risk >= MODEL.operatingThreshold ? ' high' : '');
    for (const [text, bold] of lines) {
      const p = document.createElement('p');
      if (bold) { const b = document.createElement('b'); b.textContent = text; p.append(b); }
      else p.textContent = text;
      box.append(p);
    }
  }

  document.querySelectorAll('.lang-btn').forEach((btn) => {
    btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
  });
  applyLanguage('en');

  const form = document.getElementById('quiz');
  const submitBtn = document.getElementById('submit-btn');
  const resultScreen = document.getElementById('result-screen');
  const resultNumber = document.getElementById('result-number');

  function allAnswered() {
    const required = form.querySelectorAll('[required]');
    for (const field of required) {
      if (field.type === 'radio') {
        if (!form.querySelector(`input[name="${field.name}"]:checked`)) return false;
      } else if (!field.value) {
        return false;
      }
    }
    return true;
  }

  form.addEventListener('input', () => {
    submitBtn.disabled = !allAnswered();
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const data = new FormData(form);

    const answers = {
      Age: Number(data.get('age')),
      Sex: data.get('sex'),
      Smoking: data.get('smoking') === 'yes',
      Q1_gum_disease: data.get('q1') === 'yes',
      Q3_gum_treatment: data.get('q3') === 'yes',
      Q4_loose_teeth: data.get('q4') === 'yes',
      Q5_bone_loss: data.get('q5') === 'yes',
      Q6_tooth_appearance: data.get('q6') === 'yes',
      Q2_own_teeth_gum_health: Number(data.get('q2')),
    };

    const risk = predictSevereRisk(answers);
    lastRisk = risk;
    lastAnswers = answers;
    showAdvice(risk);
    showWhy(answers);

    form.classList.add('hidden');
    resultScreen.classList.remove('hidden');
    resultScreen.scrollIntoView({ behavior: 'smooth' });
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    form.reset();
    lastRisk = null;
    lastAnswers = null;
    document.getElementById('why').classList.add('hidden');
    document.getElementById('prob-details').open = false;
    submitBtn.disabled = true;
    resultScreen.classList.add('hidden');
    form.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
</body>
</html>
